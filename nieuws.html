---
layout: default
title: Nieuws
permalink: /nieuws/
---
<ul class="nieuwslijst">
{% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <div class="meta">{{ post.date | date: '%d-%m-%Y' }}</div>
    {% if post.excerpt %}<div>{{ post.excerpt | strip_html | truncatewords: 30 }}</div>{% endif %}
  </li>
{% endfor %}
</ul>
